<div class="dialog-container">
  <!-- Header del Dialog -->
  <div class="dialog-header">
    <div class="title-with-icon">
      <div class="icon-circle">
        <mat-icon>tune</mat-icon>
      </div>
      <div>
        <h2 mat-dialog-title>Configura Intervalli</h2>
        <span class="user-subtitle">Metrica: <strong>{{ getMetricLabel(type.value) }}</strong></span>
      </div>
    </div>
    <button mat-icon-button mat-dialog-close class="close-btn" type="button" aria-label="Chiudi">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Contenuto scrollabile con margini confortevoli -->
  <mat-dialog-content class="dialog-content">
    <form [formGroup]="segmentsForm" class="metric-form">

      <!-- Selezione tipo metrica in Italiano -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Tipo di metrica</mat-label>
        <mat-select [formControl]="type" (selectionChange)="onTypeChange($event.value)" required>
          <mat-option *ngFor="let opt of metricTypeOptions" [value]="opt.type">
            {{ opt.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Unità di misura con mat-hint per evitare testi accavallati -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Unità di misura (opzionale)</mat-label>
        <input matInput [formControl]="unit">
        <mat-hint>Esempio: kg, %, kcal</mat-hint>
      </mat-form-field>

      <!-- Intestazione sezione intervalli -->
      <div class="section-header">
        <div class="section-title">
          <mat-icon>linear_scale</mat-icon>
          <span>Intervalli e Colori della Scala</span>
        </div>
        <button mat-button color="accent" type="button" class="reset-btn" (click)="loadDefaultsForCurrentType()">
          <mat-icon>restart_alt</mat-icon> Ripristina predefiniti
        </button>
      </div>

      <!-- Lista degli intervalli / segmenti -->
      <div formArrayName="segments" class="segments-list">
        <div *ngFor="let seg of segments.controls; let i = index" [formGroupName]="i" class="segment-card">
          
          <div class="segment-indicator" [style.background-color]="seg.get('color')?.value"></div>

          <div class="segment-fields-grid">
            <mat-form-field appearance="outline" class="field-label">
              <mat-label>Nome intervallo</mat-label>
              <input matInput formControlName="label" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="field-number">
              <mat-label>Min</mat-label>
              <input matInput type="number" step="0.1" formControlName="min" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="field-number">
              <mat-label>Max</mat-label>
              <input matInput type="number" step="0.1" formControlName="max" required>
            </mat-form-field>

            <div class="color-picker-box">
              <label class="color-picker-label">Colore</label>
              <div class="color-input-wrapper">
                <input type="color" formControlName="color" class="color-input" [attr.aria-label]="'Colore ' + seg.get('label')?.value">
                <span class="color-hex">{{ seg.get('color')?.value }}</span>
              </div>
            </div>
          </div>

          <button mat-icon-button color="warn" type="button" (click)="removeSegment(i)" matTooltip="Elimina intervallo" class="delete-btn">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>

        <div *ngIf="segments.length === 0" class="empty-segments-state">
          <p>Nessun intervallo configurato.</p>
          <button mat-stroked-button color="primary" type="button" (click)="loadDefaultsForCurrentType()">
            Carica intervalli standard
          </button>
        </div>
      </div>

      <button mat-stroked-button color="primary" type="button" (click)="addSegment()" class="add-segment-btn">
        <mat-icon>add</mat-icon> Aggiungi intervallo
      </button>

    </form>
  </mat-dialog-content>

  <!-- Azioni del dialog -->
  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button mat-dialog-close type="button">Annulla</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="segmentsForm.invalid">
      <mat-icon>save</mat-icon> Salva configurazione
    </button>
  </mat-dialog-actions>
</div>
